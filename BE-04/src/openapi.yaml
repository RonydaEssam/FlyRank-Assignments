openapi: 3.0.0
info: 
    title: API Task
    descripton: A minimal CRUD API for managing a to-do list.
    version: 1.0.0
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
    /tasks:
        get:
            summary: Returns a list of all tasks
            responses:
                '200':
                    description: Array of tasks
        post:
            summary: Creates a new task
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properities:
                                title:
                                    type: string
                            reuired:
                                -   title
            responses:
                '201':
                    description: Task created successfully
                '400':
                    description: Invalid or missing title
    /tasks/{id}:
        get:
            summary: Gets a single task by id
            parameters:
                -   name: id
                    in: path
                    required: true
                    schema:
                        type: integer
            responses:
                '200':
                    description: Task found
                '404':
                    description: Task not found
        put:
            sumaary: Update a task
            parameters:
                -   name: id
                    in: path
                    required: true
                    schema:
                        type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                title:
                                    type: string
                                done:
                                    type: boolean
            responses:
                '200':
                    description: Task updated
                '400':
                    description: Invalid body
                '404':
                    description: Task not found
        delete:
            summary: Delete a task
            parameters:
                -   name: id
                    in: path
                    required: true
                    schema:
                        type: integer
            responses:
                '204':
                    description: Task deleted
                '404':
                    description: Task not found
    /health:
        get:
            summary: Health check
            responses:
                '200':
                    description: Server is alive
    /auth/signup:
        post:
            summary: Create a new user account
            requestBody:
                required: true
                content:
                application/json:
                    schema:
                    type: object
                    properties:
                        email:
                            type: string
                        password:
                            type: string
                    required:
                        - email
                        - password
            responses:
                '201':
                    description: User created
                '400':
                    description: Missing email or password
    /auth/login:
        post:
            summary: Authenticate and return a JWT
            requestBody:
                required: true
                content:
                application/json:
                    schema:
                    type: object
                    properties:
                        email:
                            type: string
                        password:
                            type: string
                    required:
                        - email
                        - password
            responses:
                '200':
                    description: Login successful, returns access and refresh tokens
                '400':
                    description: Missing email or password
                '401':
                    description: Invalid login credentials

    /auth/logout:
        post:
            summary: End the user's session
            security:
                - bearerAuth: []
            responses:
                '204':
                    description: Logged out successfully
                '401':
                    description: Missing, malformed, or invalid token

    /public/info:
        get:
            summary: Public info, no auth required
            responses:
                '200':
                    description: Public message

    /protected/profile:
        get:
            summary: Get the authenticated user's profile
            security:
                - bearerAuth: []
            responses:
                '200':
                    description: User profile data
                '401':
                    description: Missing, malformed, or invalid token

    /protected/dashboard:
        get:
            summary: Example second protected route reusing the same auth guard
            security:
                - bearerAuth: []
            responses:
                '200':
                    description: Dashboard welcome message
                '401':
                    description: Missing, malformed, or invalid token
